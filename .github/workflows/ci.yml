name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (protocol)
        run: dotnet run --project tests/Pilgrim.EasyWorship.Tests --no-build -c Release -- --report-trx --coverage

      - name: Test (discovery)
        run: dotnet run --project tests/Pilgrim.EasyWorship.Discovery.Tests --no-build -c Release -- --report-trx

      - name: Test (service)
        run: dotnet run --project tests/Pilgrim.EasyWorship.Mqtt.Tests --no-build -c Release -- --report-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/**/TestResults/
